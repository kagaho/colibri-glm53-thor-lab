  </g>
  <g id="text_33">
   <text style="fill: #526674; font: 9px 'DejaVu Sans'; text-anchor: start" x="51.84" y="381.024" transform="rotate(-0 51.84 381.024)">Throughput includes prefill and HTTP overhead; TTFT is a proxy. One machine, uncontrolled OS cache, no significance claim.</text>
